# 默认：Linux host 网络，/app 是唯一持久化挂载点。
#   docker compose up -d
#   浏览器：http://<宿主机IP>:3080
# /app 之外仍是容器可写层（不是只读文件系统），重建容器后丢弃。
# host 网络会监听所有网卡；请按实际访问范围配置宿主防火墙。
name: dev-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      # 工具链版本只在 Dockerfile ARG 中定义，定制用 --build-arg。
    image: chikennice/dsh-dev-image:latest
    user: "0:0"
    init: true
    command: ["dsh", "web"]
    # 日常 shell：docker compose exec agent bash
    stdin_open: true
    tty: true
    restart: unless-stopped

    # 自动识别宿主网卡；host 模式不能再写 ports/networks。
    network_mode: host

    volumes:
      # 保留已有目录属主，由 root 直接访问。
      - ${AGENT_HOME:-/srv/agent}:/app

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 两个输入分别统一切换 Node 和 Python 工具的依赖源。
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      PNPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      YARN_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      PIP_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      UV_DEFAULT_INDEX: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      DSH_PROFILE: ${DSH_PROFILE:-web}
      # 用 - 而不是 :-：显式空值必须真的禁用安装。
      # 插件都不带版本号：每次启动装 registry 最新发布。
      DSH_PLUGINS: ${DSH_PLUGINS-@lolkda/dsh-web-lan dsh-auto-thinking-levels}
      DSH_PLUGINS_REQUIRED: ${DSH_PLUGINS_REQUIRED:-1}
      # IP 通常自动可信；通过域名访问时在这里补域名。
      DSH_WEB_TRUSTED_HOSTS: ${DSH_WEB_TRUSTED_HOSTS:-}

    cpus: "4"
    mem_limit: 8g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    # 使用 Docker 默认 capabilities，只额外启用调试能力。
    cap_add:
      - SYS_PTRACE

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 刻意不挂 /var/run/docker.sock。
