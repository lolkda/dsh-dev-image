# 快速前置检查：始终测试当前 checkout 的入口，不拉取旧 latest 冒充当前产物。
name: verify-layout

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Shell syntax and lint
        run: |
          for file in entrypoint.sh cli-env.sh tests/*.sh; do bash -n "$file"; done
          shellcheck entrypoint.sh cli-env.sh tests/*.sh
          sh -n cli-env.sh
          node --check home-init.mjs
      - name: Root CLI and configuration regression tests
        run: |
          sudo env PATH="$PATH" bash tests/entrypoint.test.sh
          sudo env PATH="$PATH" node --test tests/*.test.mjs
          npm run verify-notes
      - name: Real Team preset creation and cold resume on patched DSH
        run: bash tests/subagent-runtime.sh
      - name: Validate both Compose adapters
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f compose.bridge.yml config --quiet
          DSH_PLUGINS='' docker compose -f compose.yml config --format json | jq -e '.services.agent.environment.DSH_PLUGINS == ""'
          DSH_PLUGINS='' docker compose -f compose.bridge.yml config --format json | jq -e '.services.agent.environment.DSH_PLUGINS == ""'
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build lightweight entrypoint test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/Dockerfile
          load: true
          tags: dsh-entrypoint-test:ci
          cache-from: type=gha,scope=entrypoint-tests
          cache-to: type=gha,scope=entrypoint-tests,mode=max
      - name: Real Linux permissions under Docker default capabilities
        run: bash tests/container-runtime.sh dsh-entrypoint-test:ci
