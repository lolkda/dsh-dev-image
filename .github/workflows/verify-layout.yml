# =============================================================================
#  验证 /app 单挂载点布局（针对新镜像）
#
#  这个 workflow 存在的理由：本机没有 docker，镜像行为只能靠实测。
#  它已经抓到过一个真 bug —— Debian 的 /etc/profile 会硬编码覆盖 PATH，
#  导致登录 shell（bash -lc / su - / ssh）里 /opt/* 和 /usr/local/{cargo,go}
#  下的工具链全部 command not found，只剩恰好在 /usr/local/bin 的 dsh/python。
#
#  现在每次构建完自动跑一遍，盯住这些回归：
#    1. bash -c 和 bash -lc 两个 shell 下工具链都齐全
#    2. 空宿主目录挂到 /app 后，子目录被正确补建
#    3. 空 DSH_HOME 能自己初始化 profile 并装插件
#    4. cargo 能真的编译（不只是打印版本）
#    5. python 的 C 扩展（sqlite3/ssl/ctypes/lzma）正常
# =============================================================================
name: verify-layout

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["build-and-publish"]
    types: [completed]

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 单挂载点 + 两个 shell
        run: |
          set -eux
          IMG=ghcr.io/lolkda/dsh-dev-image:latest
          docker pull "$IMG"

          # 模拟真实部署：一个空的宿主目录挂到 /app，卷会遮蔽镜像里那一层
          HOSTDIR="$(mktemp -d)"
          chmod 777 "$HOSTDIR"

          echo "########## 1. 两个 shell 下工具链都要齐全 ##########"
          for sh in "bash -c" "bash -lc"; do
            echo "===== [$sh] ====="
            docker run --rm "$IMG" $sh '
              for c in python node npm yarn pnpm go rustc cargo java javac mvn gradle \
                       git jq yq uv rg fd cmake ninja sqlite3 tmux shellcheck gh gdb strace dsh; do
                p="$(command -v "$c" 2>/dev/null)" || { echo "  MISSING: $c"; continue; }
                printf "  ok  %-10s %s\n" "$c" "$p"
              done
              echo "  --- cargo 组件 ---"
              cargo clippy -V; rustfmt --version
            '
          done

          echo "########## 2. 空宿主目录挂 /app ##########"
          docker run --rm -v "$HOSTDIR":/app "$IMG" bash -c '
            echo "WORKDIR: $(pwd)"
            echo "DSH_HOME=$DSH_HOME  CARGO_HOME=$CARGO_HOME"
            for d in /app /app/.dsh /app/.cache/cargo /app/.cache/go/pkg/mod \
                     /app/.cache/go/build /app/.cache/pip /app/.cache/npm \
                     /app/.cache/m2 /app/.cache/gradle /app/.cache/uv; do
              [ -d "$d" ] && echo "  ok  $d" || echo "  MISSING $d"
            done
            echo "--- 空 DSH_HOME 能否初始化 profile 并装插件 ---"
            ls -la /app/.dsh/profiles/web/package.json
            echo "--- cargo 真编译 ---"
            cd /tmp && cargo new hello -q && cd hello && cargo build -q
            ./target/debug/hello
            echo "--- python C 扩展 ---"
            python -c "import sqlite3, ssl, ctypes, lzma, bz2, readline; print(\"ext ok\", sqlite3.sqlite_version)"
            echo "=== LAYOUT OK ==="
          '

          echo "########## 3. 宿主目录实际落下了什么 ##########"
          find "$HOSTDIR" -maxdepth 3 | head -25

          echo "########## 4. 容器内除 /app 外应无可写挂载 ##########"
          docker run --rm "$IMG" bash -c 'mount | grep -E "^/dev" | head; echo "---"; ls -la /app'
