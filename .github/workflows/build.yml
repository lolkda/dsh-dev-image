# 每个平台先构建并加载 → 测试该镜像 → 推送不可变 digest；全部通过后才更新公开标签。
name: build-and-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  publication-config:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate Docker Hub credentials
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          for key in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
            if [[ -z "${!key}" ]]; then
              printf '::error::Missing Actions secret: %s\n' "$key" >&2
              exit 1
            fi
          done

  checks:
    needs: publication-config
    uses: ./.github/workflows/verify-layout.yml

  build:
    needs: checks
    env:
      # 发布时由 Repository secret 决定命名空间；PR 无 secret 时只用于元数据且不推送。
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/dsh-dev-image
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # PR 先测 amd64；发布必须把 arm64 的运行时也验收完，不能只有编译冒烟。
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64", "arm64"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and load candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: dsh-dev-image:ci
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Validate candidate container permissions
        run: bash tests/container-runtime.sh dsh-dev-image:ci
      - name: Validate toolchains and temporary Web login
        run: bash tests/image-smoke.sh dsh-dev-image:ci
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested image without rebuilding
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME,,}"
          ref="${image}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARCH}"
          docker tag dsh-dev-image:ci "$ref"
          docker push "$ref"
          mkdir -p "$RUNNER_TEMP/digests"
          repo_digest="$(docker image inspect "$ref" --format '{{index .RepoDigests 0}}')"
          case "$repo_digest" in
            "$image"@*) digest="${repo_digest#"$image"@}" ;;
            "${IMAGE_NAME,,}"@*) digest="${repo_digest#"${IMAGE_NAME,,}"@}" ;;
            *) printf 'Unexpected image repository in pushed digest\n' >&2; exit 1 ;;
          esac
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] \
            || { printf 'Invalid pushed image digest\n' >&2; exit 1; }
          printf '%s@%s\n' "$image" "$digest" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - name: Export verified digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dsh-dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Public tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish manifest from verified digests
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          TAGS_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          test -s "$DIGEST_DIR/amd64.txt"
          test -s "$DIGEST_DIR/arm64.txt"
          mapfile -t images < <(cat "$DIGEST_DIR/amd64.txt" "$DIGEST_DIR/arm64.txt")
          mapfile -t tags < <(jq -r '.tags[]' <<< "$TAGS_JSON")
          test "${#images[@]}" = 2
          test "${#tags[@]}" -gt 0
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "${images[@]}"
