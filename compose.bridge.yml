# 备选：bridge 网络，保留容器与宿主 loopback 的网络隔离。
#   DSH_HOST=192.168.1.5 docker compose -f compose.bridge.yml up -d
# DSH_HOST 同时用于端口绑定和 DSH Host 围栏；默认仅宿主本机访问。
name: dev-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lolkda/dsh-dev-image:latest
    user: "0:0"
    init: true
    command: ["dsh", "web"]
    # 日常 shell：docker compose -f compose.bridge.yml exec agent bash
    stdin_open: true
    tty: true
    restart: unless-stopped

    ports:
      - "${DSH_HOST:-127.0.0.1}:${DSH_PORT:-3080}:3080"
    volumes:
      # 唯一持久化挂载点，其余容器可写层重建丢弃。
      - ${AGENT_HOME:-/srv/agent}:/app

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      npm_config_registry: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      PNPM_CONFIG_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      YARN_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
      PIP_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      UV_DEFAULT_INDEX: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      DSH_PROFILE: ${DSH_PROFILE:-web}
      # 插件都不带版本号：每次启动装 registry 最新发布。
      DSH_PLUGINS: ${DSH_PLUGINS-@lolkda/dsh-web-lan dsh-auto-thinking-levels}
      DSH_PLUGINS_REQUIRED: ${DSH_PLUGINS_REQUIRED:-1}
      DSH_WEB_TRUSTED_HOSTS: ${DSH_HOST:-127.0.0.1}

    cpus: "4"
    mem_limit: 8g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    # 使用 Docker 默认 capabilities，只额外启用调试能力。
    cap_add:
      - SYS_PTRACE

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
