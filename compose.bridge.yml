# 备选：bridge 网络，保留容器与宿主 loopback 的网络隔离。
#   DSH_HOST=192.168.1.5 docker compose -f compose.bridge.yml up -d
# DSH_HOST 同时用于端口绑定和 DSH Host 围栏；默认仅宿主本机访问。
name: dev-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/lolkda/dsh-dev-image:latest
    init: true
    command: ["dsh", "web"]
    # 日常 shell：docker compose -f compose.bridge.yml exec --user agent agent bash
    stdin_open: true
    tty: true
    restart: unless-stopped

    ports:
      - "${DSH_HOST:-127.0.0.1}:${DSH_PORT:-3080}:3080"
    volumes:
      # 唯一持久化挂载点，其余容器可写层重建丢弃。
      - ${AGENT_HOME:-/srv/agent}:/app

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AGENT_UID: ${AGENT_UID:-}
      AGENT_GID: ${AGENT_GID:-}
      DSH_PROFILE: ${DSH_PROFILE:-web}
      DSH_PLUGINS: ${DSH_PLUGINS-@lolkda/dsh-web-lan@^0.1.0}
      DSH_PLUGINS_REQUIRED: ${DSH_PLUGINS_REQUIRED:-1}
      DSH_WEB_TRUSTED_HOSTS: ${DSH_HOST:-127.0.0.1}

    cpus: "4"
    mem_limit: 8g
    pids_limit: 2048
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
      - CHOWN
      - SETUID
      - SETGID

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge
