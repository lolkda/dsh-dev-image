# DexSQL MCP：由默认 DSH_PLUGINS 安装的本地 bundle 注入。
# 所有会话都会获得 mcp__dexsql__* 工具；如需关闭，覆盖 DSH_PLUGINS 并去掉本 bundle。
- insert:
    - id: dexsql-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: dexsql
        transport: stdio
        command: /usr/local/bin/dexsql
        args:
          - mcp
          - --timeout-ms
          - "300000"
        cwd: /app
        failOnStartupError: false
        toolCallTimeoutMs: 300000
